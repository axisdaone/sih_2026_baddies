# Override file for the `prod` profile: points the API at Postgres.
# Always use together with the base file AND the profile flag:
#   docker compose -f infra/docker-compose.yml -f infra/docker-compose.prod.yml --profile prod up -d --build
#
# The API needs a Postgres driver for this to work (psycopg 3):
#   services/api/requirements.txt -> psycopg[binary]>=3.2      # PHASE2: add when moving off SQLite

services:
  api:
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://${POSTGRES_USER:-farmsignal}:${POSTGRES_PASSWORD:-farmsignal}@postgres:5432/${POSTGRES_DB:-farmsignal}}
      DEMO_MODE: ${DEMO_MODE:-false}
    depends_on:
      postgres:
        condition: service_healthy

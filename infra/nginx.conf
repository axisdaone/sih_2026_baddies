# FarmSignal edge reverse proxy.
# Mounted at /etc/nginx/conf.d/default.conf, i.e. this file is included inside the http {} context
# of the stock nginx image, so http-level directives (upstream, limit_req_zone, gzip, map) are valid here.
#
#   /api/v1/quality-pass/*  -> api:8000  (public, 60 req/min per IP, burst 20)
#   /api/*                  -> api:8000
#   /assets/*               -> web:80    (Vite hashed bundles, cached for a year, immutable)
#   sw.js / manifest        -> web:80    (never cached, so PWA updates propagate)
#   /                       -> web:80    (SPA shell; the web image serves index.html for unknown paths)

upstream farmsignal_web {
    server web:80;
    keepalive 16;
}

upstream farmsignal_api {
    server api:8000;
    keepalive 16;
}

# Contract section 6: public Quality Pass endpoints are rate-limited to 60 requests/minute per IP.
limit_req_zone $binary_remote_addr zone=quality_pass:10m rate=60r/m;
# Device login is a find-or-create credential: keep enumeration/brute force slow at the edge too
# (the API applies its own AUTH_RATE_LIMIT_PER_MIN behind this).
limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;
limit_req_status 429;

# When a TLS terminator / load balancer sits in front of this edge, recover the real client address
# from its X-Forwarded-For so both nginx zones and the API's TRUST_PROXY limiter key on the client.
set_real_ip_from 127.0.0.1;
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

# Behind a TLS terminator (Caddy / cloud LB) keep the original scheme for absolute URLs (QR links).
map $http_x_forwarded_proto $farmsignal_scheme {
    default $scheme;
    https   https;
}

# Security headers. The PWA keeps the device bearer token in localStorage, so a strict CSP is the main
# XSS/exfiltration mitigation: scripts and API calls are same-origin only (behind this edge the API is
# always same-origin `/api`), images may additionally come from OpenStreetMap (Leaflet tiles on the FPO
# map) and data:/blob: (Vite-inlined Leaflet icons, QR data URLs), styles need 'unsafe-inline' for
# React/Leaflet style attributes, and no page may be framed (clickjacking of the public pass page).
# The build has no inline <script> (vite-plugin-pwa `injectRegister: false`; main.tsx registers the SW).
# nginx quirk: `add_header` is not inherited into a location that sets its own headers, so every
# location below repeats the full set; the values live in these two maps so they are defined once.
map $host $farmsignal_csp {
    default "default-src 'self'; script-src 'self'; connect-src 'self'; img-src 'self' data: blob: https://tile.openstreetmap.org https://*.tile.openstreetmap.org; media-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'";
}

# The service worker fetches the OSM tiles itself (Workbox CacheFirst `osm-tiles` route), and a worker's
# fetch() is governed by the policy delivered with the worker script, so sw.js gets its own CSP.
map $host $farmsignal_sw_csp {
    default "default-src 'self'; script-src 'self'; connect-src 'self' https://tile.openstreetmap.org https://*.tile.openstreetmap.org; img-src 'self' data: blob: https://tile.openstreetmap.org https://*.tile.openstreetmap.org; object-src 'none'; frame-ancestors 'none'";
}

gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_comp_level 5;
gzip_proxied any;
gzip_types
    text/plain
    text/css
    text/javascript
    application/javascript
    application/json
    application/manifest+json
    image/svg+xml;

server {
    listen 80;
    server_name _;

    client_max_body_size 2m;
    server_tokens off;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $farmsignal_scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;

    add_header Content-Security-Policy $farmsignal_csp always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(self), camera=(), microphone=(), payment=()" always;

    # --- public Quality Pass: rate-limited (page payload, QR PNG, chain verification) ---
    location ^~ /api/v1/quality-pass/ {
        limit_req zone=quality_pass burst=20 nodelay;
        proxy_pass http://farmsignal_api;
        add_header Cache-Control "no-store" always;
        add_header Content-Security-Policy $farmsignal_csp always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(self), camera=(), microphone=(), payment=()" always;
    }

    # --- device login: find-or-create credential, throttled per client IP ---
    location = /api/v1/auth/device {
        limit_req zone=auth burst=5 nodelay;
        proxy_pass http://farmsignal_api;
        add_header Cache-Control "no-store" always;
        add_header Content-Security-Policy $farmsignal_csp always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(self), camera=(), microphone=(), payment=()" always;
    }

    # --- everything else under the API ---
    location ^~ /api/ {
        proxy_pass http://farmsignal_api;
        add_header Cache-Control "no-store" always;
        add_header Content-Security-Policy $farmsignal_csp always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(self), camera=(), microphone=(), payment=()" always;
    }

    # --- hashed build assets (Vite emits /assets/<name>-<hash>.<ext>) ---
    location ^~ /assets/ {
        proxy_pass http://farmsignal_web;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Content-Security-Policy $farmsignal_csp always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(self), camera=(), microphone=(), payment=()" always;
    }

    # --- service worker, its runtime and the manifest must always be revalidated ---
    location ~ ^/(sw\.js|registerSW\.js|manifest\.webmanifest|workbox-[^/]+\.js)$ {
        proxy_pass http://farmsignal_web;
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header Content-Security-Policy $farmsignal_sw_csp always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(self), camera=(), microphone=(), payment=()" always;
    }

    # --- SPA shell and remaining static files (audio clips, icons) ---
    location / {
        proxy_pass http://farmsignal_web;
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy $farmsignal_csp always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(self), camera=(), microphone=(), payment=()" always;
    }
}

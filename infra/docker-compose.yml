# FarmSignal - container stack (SIH 2026 prototype).
#
#   Dev / demo (SQLite, no external services):
#     export JWT_SECRET=$(openssl rand -hex 32)   # required; the API exits without it when ENV=prod
#     export DEMO_MODE=true                        # pitch host only (demo token, simulate, price refresh)
#     docker compose -f infra/docker-compose.yml up --build
#       -> http://localhost:80   edge (nginx: / -> web, /api -> api, rate limits, gzip, caching)
#       -> http://localhost:8080 web container directly (static bundle only)
#       -> http://localhost:8000 not published; reach the API through the edge (/api/v1/health)
#
#   Prod-style (Postgres 16; the API keeps its price cache and rate-limit state in-process):
#     docker compose -f infra/docker-compose.yml -f infra/docker-compose.prod.yml --profile prod up -d --build
#
# Environment values come from services/api/.env.example (if present) and are overridden by the
# explicit `environment:` block below, which in turn honours the host's shell variables.
# See infra/DEPLOY.md for the full variable table.

name: farmsignal

services:
  api:
    build:
      context: ../services/api
      dockerfile: Dockerfile
    image: farmsignal/api:local
    restart: unless-stopped
    env_file:
      - path: ../services/api/.env.example
        required: false
    environment:
      ENV: ${ENV:-prod}
      # SQLite lives on the named volume below; override with a Postgres URL via docker-compose.prod.yml.
      DATABASE_URL: ${DATABASE_URL:-sqlite:////var/lib/farmsignal/farmsignal.db}
      # Bundled data (mandis, snapshot prices, demo scenarios) is mounted read-only from the repo.
      DATA_DIR: /srv/farmsignal/data
      # Required: the API refuses the dev default secret when ENV=prod. Generate: openssl rand -hex 32
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set (openssl rand -hex 32)}
      JWT_TTL_DAYS: ${JWT_TTL_DAYS:-30}
      # The edge (nginx) sets X-Real-IP / X-Forwarded-For; trust them so per-client rate limits work.
      TRUST_PROXY: "true"
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost,http://localhost:8080,http://localhost:5173}
      # data.gov.in public sample key by default (rate limited, fine for demo).
      AGMARKNET_API_KEY: ${AGMARKNET_API_KEY:-579b464db66ec23bdd000001cdd3946e44ce4aad7209ff7b23ac571b}
      PRICE_POLL_HOURS: ${PRICE_POLL_HOURS:-6}
      PRICE_STALE_HOURS: ${PRICE_STALE_HOURS:-30}
      # Off by default. The pitch host sets DEMO_MODE=true explicitly: it enables the anonymous demo
      # token (write access to the demo batches), POST /prices/refresh and POST /batches/{id}/simulate.
      DEMO_MODE: ${DEMO_MODE:-false}
      # Needed only for POST /demo/seed?reset=true (sent as X-Demo-Admin-Token).
      DEMO_ADMIN_TOKEN: ${DEMO_ADMIN_TOKEN:-}
      RATE_LIMIT_PER_MIN: ${RATE_LIMIT_PER_MIN:-60}
      AUTH_RATE_LIMIT_PER_MIN: ${AUTH_RATE_LIMIT_PER_MIN:-10}
    volumes:
      - api_data:/var/lib/farmsignal
      - ../data:/srv/farmsignal/data:ro
    expose:
      - "8000"
    healthcheck:
      # curl if the image has it, otherwise the Python stdlib (python:*-slim images ship without curl).
      test:
        - CMD-SHELL
        - >-
          curl -fsS http://localhost:8000/api/v1/health >/dev/null
          || python -c "import sys,urllib.request; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/v1/health', timeout=3).status == 200 else 1)"
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  web:
    build:
      context: ../apps/web
      dockerfile: Dockerfile
    image: farmsignal/web:local
    restart: unless-stopped
    ports:
      # Direct access to the static bundle. API calls need the edge below (same-origin /api).
      - "${WEB_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  edge:
    # Public entry point: reverse proxy with gzip, immutable-asset caching and the
    # 60 req/min/IP limit on the public Quality Pass endpoints (contract section 6).
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${EDGE_PORT:-80}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost/api/v1/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ---- optional production services (activate with --profile prod) ----
  postgres:
    image: postgres:16-alpine
    profiles: ["prod"]
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-farmsignal}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-farmsignal}
      POSTGRES_DB: ${POSTGRES_DB:-farmsignal}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-farmsignal} -d ${POSTGRES_DB:-farmsignal}"]
      interval: 10s
      timeout: 5s
      retries: 10

  # No Redis: nothing in the API reads REDIS_URL today (config.py has no such setting). The price
  # cache and the sliding-window rate limiter are in-process, which the PRD allows for the demo and
  # which is correct as long as a single API process runs. A shared cache is a Phase 2 item.

volumes:
  api_data:
  pg_data:
